services:
  database:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    expose:
      - 5432
    volumes:
      - database:/var/lib/postgresql

  api:
    image: nicolaspaillard/bdoapi:latest
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      PORT: 8080
    expose:
      - 8080
    depends_on:
      - database

  api-dev:
    image: nicolaspaillard/bdoapi-dev:latest
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      PORT: 8081
    expose:
      - 8081
    volumes:
      - backend-dev:/app
    depends_on:
      - database

volumes:
  database:
  backend-dev:
